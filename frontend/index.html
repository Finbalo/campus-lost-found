<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #cfd6e0;
    --card: #ffffff;
    --lost: #d7452a;
    --found: #0b7d7f;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 64px; }
  header { padding: 44px 0 24px; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.02; margin: 0 0 10px; font-weight: 800; letter-spacing: -0.02em; max-width: 14ch; }
  header p { margin: 0; color: var(--muted); max-width: 52ch; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0; }
  .tabs { display: flex; gap: 6px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .tab {
    border: 1.5px solid var(--ink); background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .search { flex: 1; min-width: 180px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; }
  .post-btn { background: var(--lost); color: #fff; border: 0; padding: 10px 20px; border-radius: 999px; font-weight: 700; cursor: pointer; }
  :focus-visible { outline: 3px solid #4c8dff; outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  /* the claim tag: punched hole + coloured stub on the left */
  .tag {
    position: relative; background: var(--card); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; border: 1px solid var(--line);
    border-left: 14px solid var(--accent);
  }
  .tag[data-type="lost"] { --accent: var(--lost); }
  .tag[data-type="found"] { --accent: var(--found); }
  .tag::before {
    content: ""; position: absolute; top: 14px; left: -9px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--line);
  }
  .tag img { width: 100%; height: 170px; object-fit: cover; display: block; background: #dfe5ec; }
  .tag .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .kind { font-weight: 800; color: var(--accent); font-size: .95rem; }
  .tag h3 { margin: 0; font-size: 1.2rem; line-height: 1.2; }
  .meta { color: var(--muted); font-size: .92rem; margin: 0; }
  .desc { margin: 2px 0 0; font-size: .96rem; }
  .actions { margin-top: auto; padding-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px dashed var(--line); }
  .contact { font-weight: 600; word-break: break-word; }
  .resolve { margin-left: auto; background: transparent; border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .88rem; font-weight: 600; }
  .resolve:hover { background: var(--ink); color: #fff; }
  .empty { grid-column: 1 / -1; padding: 36px; border: 2px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); }

  dialog { border: 0; border-radius: 14px; padding: 0; width: min(520px, 94vw); box-shadow: 0 20px 60px rgba(20,33,61,.3); }
  dialog::backdrop { background: rgba(20,33,61,.5); }
  form { padding: 24px; display: grid; gap: 14px; }
  form h2 { margin: 0; font-size: 1.6rem; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
  input, select, textarea { padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; font-weight: 400; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice { display: flex; gap: 8px; }
  .choice label { flex: 1; font-weight: 700; }
  .choice input { position: absolute; opacity: 0; }
  .choice span { display: block; text-align: center; padding: 10px; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; }
  .choice input:checked + span.l { border-color: var(--lost); color: var(--lost); background: #fdf0ed; }
  .choice input:checked + span.f { border-color: var(--found); color: var(--found); background: #e8f5f5; }
  .choice input:focus-visible + span { outline: 3px solid #4c8dff; outline-offset: 2px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .cancel { background: none; border: 0; cursor: pointer; font-weight: 600; padding: 8px 12px; }
  .error { color: var(--lost); font-weight: 600; min-height: 1.2em; margin: 0; }
  @media (prefers-reduced-motion: no-preference) { .tag { transition: transform .15s; } .tag:hover { transform: translateY(-2px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lost something on campus?</h1>
    <p>Post what you lost or what you found. If a lost item and a found item look alike, we email the people involved.</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Filter by type">
      <button class="tab" data-filter="all" aria-pressed="true">All</button>
      <button class="tab" data-filter="lost" aria-pressed="false">Lost</button>
      <button class="tab" data-filter="found" aria-pressed="false">Found</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search keys, phone, library..." aria-label="Search items">
    <button class="post-btn" id="open-form">Post an item</button>
  </div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<dialog id="dialog">
  <form id="form">
    <h2>Post an item</h2>
    <div class="choice" role="radiogroup" aria-label="Type">
      <label><input type="radio" name="type" value="lost" checked><span class="l">I lost it</span></label>
      <label><input type="radio" name="type" value="found"><span class="f">I found it</span></label>
    </div>
    <label>What is it?<input name="title" maxlength="80" required placeholder="Black Tecno phone with cracked screen"></label>
    <div class="row">
      <label>Category
        <select name="category" required>
          <option value="phone">Phone</option>
          <option value="id-card">ID card</option>
          <option value="keys">Keys</option>
          <option value="bag">Bag</option>
          <option value="clothing">Clothing</option>
          <option value="books">Books</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>Where?<input name="location" maxlength="80" required placeholder="Library, 2nd floor"></label>
    </div>
    <label>Details<textarea name="description" maxlength="300" rows="2" placeholder="Anything that helps prove it's yours"></textarea></label>
    <label>How can people reach you?<input name="contact" maxlength="80" required placeholder="WhatsApp number or email"></label>
    <label>Photo (optional)<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label>
    <p class="error" id="error" role="alert"></p>
    <div class="form-actions">
      <button type="button" class="cancel" id="cancel">Cancel</button>
      <button class="post-btn" id="submit">Post item</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script>
const API = window.CONFIG.API_URL;
const grid = document.getElementById("grid");
const dialog = document.getElementById("dialog");
const form = document.getElementById("form");
const errorEl = document.getElementById("error");
let items = [], filter = "all", query = "";

async function api(path, options) {
  const res = await fetch(API + path, {
    ...options,
    headers: { "content-type": "application/json" },
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function el(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  kids.forEach(k => node.append(k));
  return node;
}

function render() {
  grid.replaceChildren();
  const q = query.toLowerCase();
  const shown = items.filter(i =>
    (filter === "all" || i.type === filter) &&
    (!q || [i.title, i.description, i.location, i.category].join(" ").toLowerCase().includes(q)));

  if (!shown.length) {
    grid.append(el("div", { className: "empty", textContent: "Nothing here yet. Post the first item." }));
    return;
  }
  for (const i of shown) {
    const card = el("article", { className: "tag" });
    card.dataset.type = i.type;
    if (i.photoUrl) card.append(el("img", { src: i.photoUrl, alt: i.title, loading: "lazy" }));
    const body = el("div", { className: "body" },
      el("span", { className: "kind", textContent: i.type === "lost" ? "Lost" : "Found" }),
      el("h3", { textContent: i.title }),
      el("p", { className: "meta", textContent: `${i.location} - ${new Date(i.created * 1000).toLocaleDateString()}` }));
    if (i.description) body.append(el("p", { className: "desc", textContent: i.description }));
    const resolve = el("button", { className: "resolve", textContent: i.type === "lost" ? "I got it back" : "Returned to owner" });
    resolve.onclick = async () => { await api(`/items/${i.id}/resolve`, { method: "POST", body: "{}" }); load(); };
    body.append(el("div", { className: "actions" }, el("span", { className: "contact", textContent: i.contact }), resolve));
    card.append(body);
    grid.append(card);
  }
}

async function load() {
  try { items = (await api("/items")).items; }
  catch (e) { grid.replaceChildren(el("div", { className: "empty", textContent: "Could not load items. Refresh to try again." })); return; }
  render();
}

document.querySelectorAll(".tab").forEach(btn => btn.onclick = () => {
  filter = btn.dataset.filter;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b === btn));
  render();
});
document.getElementById("search").oninput = e => { query = e.target.value; render(); };
document.getElementById("open-form").onclick = () => { errorEl.textContent = ""; dialog.showModal(); };
document.getElementById("cancel").onclick = () => dialog.close();

form.onsubmit = async e => {
  e.preventDefault();
  const submit = document.getElementById("submit");
  submit.disabled = true; submit.textContent = "Posting...";
  errorEl.textContent = "";
  try {
    const f = new FormData(form);
    let photoKey = "";
    const photo = f.get("photo");
    if (photo && photo.size) {
      if (photo.size > 5 * 1024 * 1024) throw new Error("Photo must be under 5 MB.");
      const { uploadUrl, key } = await api("/upload-url", { method: "POST", body: JSON.stringify({ contentType: photo.type }) });
      const put = await fetch(uploadUrl, { method: "PUT", headers: { "content-type": photo.type }, body: photo });
      if (!put.ok) throw new Error("Photo upload failed.");
      photoKey = key;
    }
    const payload = Object.fromEntries([...f.entries()].filter(([k]) => k !== "photo"));
    await api("/items", { method: "POST", body: JSON.stringify({ ...payload, photoKey }) });
    form.reset(); dialog.close(); load();
  } catch (err) {
    errorEl.textContent = err.message;
  } finally {
    submit.disabled = false; submit.textContent = "Post item";
  }
};

load();
</script>
</body>
</html>
