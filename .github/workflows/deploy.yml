name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

env:
  AWS_REGION: eu-west-1
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint and test Lambda
        run: |
          pip install ruff pytest boto3
          ruff check lambda --line-length 120
          pytest lambda -q
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - name: Terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                         -backend-config="key=campus-lost-found.tfstate" \
                         -backend-config="region=${{ env.AWS_REGION }}"
          terraform plan -no-color -input=false

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true
      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_notify_email: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                         -backend-config="key=campus-lost-found.tfstate" \
                         -backend-config="region=${{ env.AWS_REGION }}"
          terraform apply -auto-approve -input=false
      - name: Publish frontend
        working-directory: terraform
        run: |
          API_URL=$(terraform output -raw api_url)
          BUCKET=$(terraform output -raw site_bucket)
          DIST=$(terraform output -raw distribution_id)
          CLIENT_ID=$(terraform output -raw cognito_client_id)
          echo "window.CONFIG = { API_URL: \"$API_URL\", CLIENT_ID: \"$CLIENT_ID\", REGION: \"$AWS_REGION\" };" > ../frontend/config.js
          aws s3 sync ../frontend "s3://$BUCKET" --delete --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
          echo "Live at $(terraform output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
